<mat-sidenav-container class="app-shell">
  <a class="app-shell__skip" href="#main">Vai al contenuto</a>

  <mat-sidenav
    class="app-shell__sidenav"
    [mode]="sidenavMode()"
    [opened]="sidenavOpened()"
  >
    <a class="app-shell__brand" routerLink="/">
      <span class="app-shell__brand-name">Reflecta</span>
      <span class="app-shell__brand-tag">il tuo diario</span>
    </a>
    <mat-nav-list class="app-shell__nav" aria-label="Navigazione principale">
      <a
        mat-list-item
        [disableRipple]="true"
        routerLink="/"
        routerLinkActive="app-shell__nav-item--active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeSidenavOnMobile()"
      >
        Scrivi
      </a>
      <a
        mat-list-item
        [disableRipple]="true"
        routerLink="/entries"
        routerLinkActive="app-shell__nav-item--active"
        (click)="closeSidenavOnMobile()"
      >
        Archivio
      </a>
      <a
        mat-list-item
        [disableRipple]="true"
        routerLink="/settings"
        routerLinkActive="app-shell__nav-item--active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeSidenavOnMobile()"
      >
        Impostazioni
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="app-shell__toolbar">
      <button
        mat-icon-button
        class="app-shell__menu"
        type="button"
        aria-label="Apri navigazione"
        (click)="toggleSidenav()"
      >
        <svg class="app-shell__menu-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 6h16v2H4zM4 11h16v2H4zM4 16h16v2H4z" fill="currentColor" />
        </svg>
      </button>
      <span class="app-shell__toolbar-title">{{ title() }}</span>
    </mat-toolbar>

    <main class="app-shell__main" id="main">
      <div class="app-shell__container">
        <router-outlet />
      </div>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
