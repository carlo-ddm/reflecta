@if (isLoading()) {
<section class="page">
  <div class="page__body">
    <article class="entry-detail">
      <div class="rf-skeleton skeleton--date"></div>
      <div class="rf-skeleton skeleton--title"></div>
      <div class="rf-skeleton skeleton--text"></div>
      <div class="rf-skeleton skeleton--text skeleton--short"></div>
    </article>
  </div>
</section>
} @else if (hasError()) {
<section class="page">
  <div class="page__body">
    <mat-card class="state-card" role="alert">
      <mat-card-content>
        <div class="state-card__title">Voce non trovata</div>
        <div class="state-card__text">Impossibile caricare questa voce del diario.</div>
        <a class="state-card__cta rf-button rf-button--tonal" routerLink="/entries">Torna all'archivio</a>
      </mat-card-content>
    </mat-card>
  </div>
</section>
} @else {
<section class="page entry-detail-page">
  <div class="entry-detail__toolbar">
    <a mat-button class="rf-button rf-button--tonal" routerLink="/entries">← Archivio</a>
    <button
      mat-button
      class="rf-button rf-button--ghost"
      type="button"
      (click)="openDeleteDialog()"
      [disabled]="isDeleting()"
    >
      {{ isDeleting() ? 'Elimino…' : 'Elimina' }}
    </button>
  </div>

  <article class="entry-detail" aria-label="Voce del diario">
    <header class="entry-detail__head">
      <time class="entry-detail__date" [attr.datetime]="entry()?.date">
        {{ entry()?.date | date: 'EEEE d MMMM y' }}
      </time>
      <h1 class="entry-detail__title">{{ entry()?.title || 'Senza titolo' }}</h1>
    </header>
    <div class="entry-detail__text">{{ entry()?.content || entry()?.snippet }}</div>
  </article>
</section>
}
