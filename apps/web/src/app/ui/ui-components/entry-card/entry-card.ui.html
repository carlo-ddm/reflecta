<li class="entries-list__item">
  <a class="entry-card" [routerLink]="link()">
    <mat-card class="entry-card__surface">
      <mat-card-content>
        <time class="entry-card__date" [attr.datetime]="entry().date">
          {{ entry().date | date: 'EEEE d MMMM y' }}
        </time>
        <h2 class="entry-card__title">{{ entry().title || 'Senza titolo' }}</h2>
        <p class="entry-card__snippet">{{ entry().snippet }}</p>
      </mat-card-content>
    </mat-card>
  </a>
</li>
